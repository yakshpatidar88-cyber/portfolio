# =====================================================================================
# LedgerLock: Core Application Configuration
# =====================================================================================

spring:
  application:
    name: ledgerlock

  # Enable Java 21+ Virtual Threads (Project Loom) for high-throughput non-blocking I/O
  threads:
    virtual:
      enabled: true

  # ===================================================================================
  # PostgreSQL Datasource Configuration
  # ===================================================================================
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlock_db
    username: ledger_admin
    password: ledger_secret_password
    driver-class-name: org.postgresql.Driver
    # High-Performance HikariCP Connection Pool
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: LedgerLockHikariPool

  # ===================================================================================
  # JPA & Hibernate Settings
  # Note: ddl-auto is strictly 'validate'. Schema is managed 100% by Flyway!
  # ===================================================================================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ===================================================================================
  # Flyway Database Migrations
  # ===================================================================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# =====================================================================================
# Server Port Configuration
# =====================================================================================
server:
  port: 8080

# =====================================================================================
# Management & Observability Endpoints
# =====================================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
         
          # ===================================================================================
  # Redis 7 Configuration for Redlock & CQRS Balance Cache
  # ===================================================================================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
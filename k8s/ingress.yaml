apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gridops-ingress
  namespace: gridops-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "gridops-backend"
spec:
  tls:
    - hosts:
        - api.gridops.internal
      secretName: gridops-tls-cert
  rules:
    - host: api.gridops.internal
      http:
        paths:
          - path: /api/v1/analytics
            pathType: Prefix
            backend:
              service:
                name: gridops-analytics
                port:
                  number: 8000
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: gridops-backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: gridops-backend
                port:
                  number: 8080
